cache_dir: "cache_data"
embed_device: "cuda"
seed: 42
max_steps_per_epoch: 500
num_workers: 0
epochs: 20
early_stop: 5
eval_only: false
wandb: false
wandb_project: "rdl-task-embedding"
## you can choose "none", "distribution", "inges" here
feature_transform: "none"
text_encoder: "glove"
eval_in_train: -1
resnet_transform: false
val_sample_size: 2000
test_sample_size: 2000
## whether to use the full dataset for final evaluation
last_full: true
result_db_name: "task-embedding"
## database backend: "sqlite" (default, local) or "mongodb"
db_backend: "sqlite"
db_location: "./swap_db"
db_name: "swap"