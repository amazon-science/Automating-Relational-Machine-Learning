model_type: rdl
encoder_num_layers: 4
channels: 64
torch_frame_model_cls: resnet
batch_size: 128
eval_batch_size: 256
num_negative_samples: 1
share_same_time: true
gnn_config:
  pre_sf: none
  post_sf: none
  hidden_channels: 64
  num_heads: 1
  dropout: 0.0
  norm: none
  aggregation: mean
  jk: false
  skip_connection: false
  mpnn_type: pna
  mpnn_design_choice: sage
  loss_fn: bpr
sampler_config:
  temporal: last
  num_neighbors: 32
  num_layers: 1
  loader_type: node
optimizer_config:
  lr: 0.0001
  weight_decay: 0.0
  scheduler: exponential
  gamma: 0.8
