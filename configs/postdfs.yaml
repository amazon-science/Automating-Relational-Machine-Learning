transforms:
  - name: column_transform_chain
    config:
      transforms:
        - name: canonicalize_numeric
        - name: canonicalize_datetime
        - name: glove_text_embedding
        - name: featurize_datetime
          config:
            methods:
              - YEAR
              - MONTH
              - DAY
              - DAYOFWEEK
            retain_original: true
        - name: norm_numeric
        - name: remap_category
  - name: filter_column
  - name: fill_timestamp
only_do_task_transform: true